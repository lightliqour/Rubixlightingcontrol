name: Backend

on:
  push:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - - name: Run tests
  env:
    RUBIX_CONFIG_DIR: ${{ github.workspace }}/runtime/config
    RUBIX_DATA_DIR: ${{ github.workspace }}/runtime/data
    RUBIX_LOG_DIR: ${{ github.workspace }}/runtime/logs
  run: pytest tests

      - name: Check Python syntax
        run: |
          python -m compileall backend/app